[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bizx"
version = "0.1.0"
description = "A unified Python ecosystem for Data Engineering, AI, ML, GenAI, MLOps, and cloud-native analytics."
readme = "README.md"
requires-python = ">=3.10"

license = { file = "LICENSE" }

authors = [
    { name = "Saman Siadati" }
]

keywords = [
    "data",
    "data-engineering",
    "ai",
    "artificial-intelligence",
    "machine-learning",
    "generative-ai",
    "genai",
    "llm",
    "mlops",
    "cloud",
    "aws",
    "spark",
    "databricks"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent"
]

dependencies = []

[project.optional-dependencies]

data = [
    "numpy>=1.26",
    "pandas>=2.0"
]

ai = [
    "numpy>=1.26",
    "scikit-learn>=1.4"
]

llm = [
    "transformers>=4.40",
    "huggingface-hub>=0.20"
]

aws = [
    "boto3>=1.34"
]

spark = [
    "pyspark>=3.5"
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0"
]

all = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "transformers>=4.40",
    "huggingface-hub>=0.20",
    "boto3>=1.34",
    "pyspark>=3.5"
]

[project.urls]
Homepage = "https://github.com/samansiadati/bizx"
Repository = "https://github.com/samansiadati/bizx"
Issues = "https://github.com/samansiadati/bizx/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
