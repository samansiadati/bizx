[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bizx"
version = "0.1.0"
description = "An open-source Data & AI engineering ecosystem for building modern, production-oriented applications."
readme = "README.md"
requires-python = ">=3.10"

license = "MIT"

authors = [
    { name = "Saman Siadati" }
]

keywords = [
    "bizx",
    "data-engineering",
    "data",
    "etl",
    "data-processing",
    "data-quality",
    "data-profiling",
    "pandas",
    "spark",
    "pyspark",
    "sql",
    "artificial-intelligence",
    "ai",
    "machine-learning",
    "deep-learning",
    "generative-ai",
    "genai",
    "llm",
    "rag",
    "ai-agents",
    "mlops",
    "observability",
    "cloud",
    "aws",
    "azure",
    "gcp"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

dependencies = []

[project.optional-dependencies]

de = [
    "numpy>=1.26",
    "pandas>=2.0"
]

spark = [
    "pyspark>=3.5"
]

ai = [
    "numpy>=1.26",
    "scikit-learn>=1.4"
]

genai = [
    "transformers>=4.40",
    "huggingface-hub>=0.20"
]

aws = [
    "boto3>=1.34"
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0"
]

all = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyspark>=3.5",
    "scikit-learn>=1.4",
    "transformers>=4.40",
    "huggingface-hub>=0.20",
    "boto3>=1.34"
]

[project.urls]
Homepage = "https://github.com/samansiadati/bizx"
Repository = "https://github.com/samansiadati/bizx"
Issues = "https://github.com/samansiadati/bizx/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]